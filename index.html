<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DryGuard - Regenwarner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      transition: background-color 0.5s ease;
      padding: 20px 0;
    }
    body.raining {
      background-color: #b71c1c; /* Rot bei Regen */
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 360px;
      width: 90%;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }
    p {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 15px;
    }
    .status {
      font-size: 16px;
      font-weight: bold;
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      background: #2c2c2c;
    }
    .coords-box {
      background: #252525;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 12px;
      text-align: left;
    }
    .coords-inputs {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    input {
      width: 100%;
      background: #121212;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    /* Entfernt die Updown-Pfeile bei number-Inputs für Chrome, Safari, Edge, Opera */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* Entfernt die Updown-Pfeile für Firefox */
    input[type=number] {
      -moz-appearance: textfield;
    }

    button {
      background-color: #1b5e20;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2e7d32;
    }
    .rain-details {
      font-size: 12px;
      color: #888;
      margin-top: 12px;
    }
    footer {
      font-size: 11px;
      color: #666;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body onclick="initAudioUserInteraction()">

  <div class="card">
    <h1>☔ DryGuard</h1>
    <p>Automatische Regen-Frühwarnung</p>
    
    <div id="status-box" class="status" style="color: #4CAF50;">Überwachung aktiv...</div>
    <div id="rain-time-info" style="font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 10px;">Prüfe Wetterdaten...</div>
    
    <div class="rain-details" id="details">Letzter Check: Lädt...</div>

    <!-- Koordinaten-Einstellung mit Ein/Aus-Schalter -->
    <div class="coords-box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="color: #888; display: block; font-size: 11px;">Aktiver Standort (Lat / Lon):</span>
          <span id="coords-display" style="font-family: monospace; color: #ccc; font-size: 13px;">53.5606, 9.9439</span>
        </div>
        <button onclick="toggleCoordsEdit(event)" style="width: auto; padding: 6px 12px; font-size: 11px; margin-top: 0; background-color: #333;">Ändern</button>
      </div>
      
      <!-- Verstecktes Fenster zum Anpassen der Koordinaten -->
      <div id="coords-edit-modal" class="hidden" style="margin-top: 10px; border-top: 1px solid #444; padding-top: 8px;">
        <div class="coords-inputs">
          <input type="number" step="0.0001" id="lat-input" placeholder="Lat">
          <input type="number" step="0.0001" id="lon-input" placeholder="Lon">
        </div>
        <button onclick="updateCoordinates(event)">Standort speichern</button>
      </div>
    </div>
  </div>

  <footer>
    DryGuard - Version 1.2
  </footer>

  <script>
    // Standardkoordinaten für Hamburg (Straße 33, 22769 Hamburg)
    let lat = 53.5606;
    let lon = 9.9439;
    
    let watchInterval = null;
    let isAudioEnabled = false;

    // Web Audio API Vorbereitung
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioContext = new AudioCtx();
    let alarmBuffer = null;

    // Inputs beim Start befüllen
    document.getElementById('lat-input').value = lat;
    document.getElementById('lon-input').value = lon;

    // alarm.mp3 im Hintergrund vorladen
    fetch('DryGuard.mp3')
      .then(res => res.arrayBuffer())
      .then(buffer => audioContext.decodeAudioData(buffer))
      .then(decoded => { alarmBuffer = decoded; })
      .catch(err => console.error("Fehler beim Vorladen der alarm.mp3:", err));

    // Audio-Kontext entsperren, falls Browser ihn blockiert
    function initAudioUserInteraction() {
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      isAudioEnabled = true;
    }

    // Ein- und Ausschalten des Koordinaten-Fensters
    function toggleCoordsEdit(event) {
      event.stopPropagation();
      const modal = document.getElementById('coords-edit-modal');
      modal.classList.toggle('hidden');
    }

    // Standort über Eingabefelder aktualisieren und Fenster schließen
    function updateCoordinates(event) {
      event.stopPropagation(); // Verhindert Auslösen des Body-Clicks
      const newLat = parseFloat(document.getElementById('lat-input').value);
      const newLon = parseFloat(document.getElementById('lon-input').value);

      if (!isNaN(newLat) && !isNaN(newLon)) {
        lat = newLat;
        lon = newLon;
        document.getElementById('coords-display').textContent = `${lat}, ${lon}`;
        document.getElementById('coords-edit-modal').classList.add('hidden');
        checkWeather();
      } else {
        alert("Bitte gültige Koordinaten eingeben.");
      }
    }

    // Automatischer Start beim Laden der App
    window.onload = function() {
      initAudioUserInteraction();
      checkWeather();
      watchInterval = setInterval(checkWeather, 3 * 60 * 1000); // Alle 3 Minuten prüfen
    };

    function checkWeather() {
      const details = document.getElementById('details');
      const now = new Date().toLocaleTimeString();

      // Open-Meteo API mit minütlicher Niederschlagsprognose
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&minutely_15=precipitation&timezone=Europe%2FBerlin`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          details.textContent = `Letzter Check: ${now}`;

          if (data && data.minutely_15) {
            evaluateRainForecast(data.minutely_15);
          }
        })
        .catch(error => {
          console.error("Fehler beim Wetter-Abruf:", error);
          details.textContent = `Letzter Check: ${now} (Fehler)`;
        });
    }

    function evaluateRainForecast(minutelyData) {
      const times = minutelyData.time;
      const precip = minutelyData.precipitation;
      const now = new Date();
      
      let rainExpectedTime = null;

      // Suche nach dem ersten Regenzeitpunkt in der Zukunft
      for (let i = 0; i < times.length; i++) {
        const forecastTime = new Date(times[i]);
        if (forecastTime > now && precip[i] > 0) {
          rainExpectedTime = forecastTime;
          break;
        }
      }

      const statusBox = document.getElementById('status-box');
      const rainTimeInfo = document.getElementById('rain-time-info');

      if (rainExpectedTime) {
        const diffMs = rainExpectedTime - now;
        const diffMins = Math.floor(diffMs / (1000 * 60));
        const timeString = rainExpectedTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        rainTimeInfo.textContent = `Voraussichtlich Regen um ${timeString} Uhr`;

        // Alarm auslösen, wenn Regen in den nächsten 5 Minuten bevorsteht oder bereits einsetzt
        if (diffMins <= 5 && diffMins >= 0) {
          document.body.classList.add('raining');
          statusBox.style.color = "#fff";
          statusBox.textContent = `🚨 REGEN IN CA. ${diffMins} MIN!`;
          playAlarmSound();
        } else {
          document.body.classList.remove('raining');
          statusBox.style.color = "#4CAF50";
          statusBox.textContent = "Überwachung aktiv (Trocken)";
        }
      } else {
        document.body.classList.remove('raining');
        rainTimeInfo.textContent = "Kein Regen in nächster Zeit erwartet ☀️";
        statusBox.style.color = "#4CAF50";
        statusBox.textContent = "Überwachung aktiv (Trocken)";
      }
    }

    function playAlarmSound() {
      if (audioContext.state === 'suspended') audioContext.resume();
      
      if (alarmBuffer) {
        const source = audioContext.createBufferSource();
        source.buffer = alarmBuffer;
        source.connect(audioContext.destination);
        source.start(0);
      } else {
        // Fallback falls Puffer noch lädt
        new Audio('DryGuard.mp3').play().catch(() => {});
      }
    }
  </script>

</body>
</html>
